name: Validate Well Importer

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read plugin version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version=//p' WellImporter/metadata.txt | head -n 1)"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid plugin version: $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Plugin version: $VERSION"

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^repository=https://github.com/SashaRai/WellImporter-QGIS$' WellImporter/metadata.txt
          python -m py_compile WellImporter/*.py
          python tests/test_well_number_field_resolver.py
          python tests/test_spatial_pairing.py
          python - <<'PY'
          from pathlib import Path
          import ast
          import xml.etree.ElementTree as ET
          root = Path('WellImporter')
          files = sorted(root.glob('*.py'))
          modules = {p.stem for p in files}
          for path in files:
              tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.ImportFrom) and node.level == 1 and node.module:
                      module = node.module.split('.')[0]
                      if module not in modules:
                          raise SystemExit(f'Missing module {module} imported by {path}')
          for path in root.glob('*.ui'):
              ET.parse(path)
          print(f'Python modules checked: {len(files)}')
          PY
          find WellImporter -type d -name '__pycache__' -prune -exec rm -rf {} +
          find WellImporter -type f -name '*.pyc' -delete
          find tests -type d -name '__pycache__' -prune -exec rm -rf {} + 2>/dev/null || true
          find tests -type f -name '*.pyc' -delete 2>/dev/null || true

      - name: Package validation
        shell: bash
        run: |
          set -euo pipefail
          ZIP="WellImporter-v${VERSION}.zip"
          SHA="WellImporter-v${VERSION}.sha256.txt"
          zip -qr "$ZIP" WellImporter
          unzip -t "$ZIP"
          ZIP="$ZIP" python - <<'PY'
          import os
          import zipfile
          path = os.environ['ZIP']
          with zipfile.ZipFile(path) as zf:
              names = zf.namelist()
              assert {x.split('/',1)[0] for x in names if x} == {'WellImporter'}
              assert 'WellImporter/__init__.py' in names
              assert 'WellImporter/metadata.txt' in names
              assert 'WellImporter/spatial_pairing.py' in names
              assert 'WellImporter/spatial_circle_repair.py' in names
              assert 'WellImporter/well_importer_dialog_v222.py' in names
              assert not any('__pycache__' in x or x.endswith(('.pyc', '.pyo')) for x in names)
          PY
          sha256sum "$ZIP" > "$SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: WellImporter-v${{ env.VERSION }}-install
          path: |
            WellImporter-v${{ env.VERSION }}.zip
            WellImporter-v${{ env.VERSION }}.sha256.txt
          retention-days: 30
