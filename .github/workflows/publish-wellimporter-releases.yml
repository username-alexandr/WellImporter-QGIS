name: Publish Well Importer historical releases

on:
  push:
    branches:
      - chore/publish-releases-2.1.0
    paths:
      - release-source/READY

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout publishing branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and validate historical source archive
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/wellimporter-release-work"
          mkdir -p "$WORK/extracted" "$WORK/packages"
          cat release-source/chunks/chunk* > "$WORK/history.b64"
          base64 --decode "$WORK/history.b64" > "$WORK/history.tar.xz"
          echo "da10458fc389a1a143f1f71e8bcb37056c18b62a852292d53dfa8471f19c0bc4  $WORK/history.tar.xz" | sha256sum --check --strict
          xz -t "$WORK/history.tar.xz"
          tar -xJf "$WORK/history.tar.xz" -C "$WORK/extracted"
          HIST="$WORK/extracted/release_source_history"
          test -d "$HIST"
          count=$(find "$HIST" -mindepth 2 -maxdepth 2 -name metadata.txt | wc -l)
          echo "Historical metadata files: $count"
          test "$count" -eq 26

      - name: Publish historical branches, tags and Releases
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/wellimporter-release-work"
          HIST="$WORK/extracted/release_source_history"
          PACKAGES="$WORK/packages"
          VERSIONS=(
            1.0.0 1.1.0 1.2.0 1.3.0
            1.4.0 1.4.1 1.4.2 1.4.3 1.4.4
            1.5.0 1.5.1 1.5.2 1.5.3 1.5.4 1.5.5 1.5.6
            1.6.0 1.7.0 1.8.0
            2.0.0 2.0.1 2.0.2 2.0.3 2.0.4 2.0.5 2.0.6
          )

          git config user.name "SashaRai"
          git config user.email "56488397+SashaRai@users.noreply.github.com"

          for version in "${VERSIONS[@]}"; do
            echo "=== Publishing historical version $version ==="
            src="$HIST/$version/WellImporter"
            test -f "$src/metadata.txt"
            test -f "$src/__init__.py"

            stage="$WORK/stage-$version"
            rm -rf "$stage"
            mkdir -p "$stage"
            cp -a "$src" "$stage/WellImporter"
            find "$stage/WellImporter" -type d -name '__pycache__' -prune -exec rm -rf {} + || true
            find "$stage/WellImporter" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete || true

            zip_path="$PACKAGES/WellImporter-v$version.zip"
            rm -f "$zip_path"
            (cd "$stage" && zip -qr "$zip_path" WellImporter)
            unzip -tq "$zip_path"
            test "$(unzip -Z1 "$zip_path" | cut -d/ -f1 | sort -u)" = "WellImporter"
            unzip -Z1 "$zip_path" | grep -qx 'WellImporter/metadata.txt'
            unzip -Z1 "$zip_path" | grep -qx 'WellImporter/__init__.py'

            git switch --detach origin/main >/dev/null 2>&1
            tmp_branch="release-snapshot-$version"
            git branch -D "$tmp_branch" >/dev/null 2>&1 || true
            git switch --orphan "$tmp_branch" >/dev/null 2>&1
            git rm -rf . >/dev/null 2>&1 || true
            git clean -fdx >/dev/null 2>&1 || true
            cp -a "$stage/WellImporter" ./WellImporter
            cat > RELEASE.md <<EOF
          # Well Importer $version

          Исторический снимок исходного кода Well Importer $version.

          - Архивная ветка: \`archive/v$version\`
          - Тег релиза: \`v$version\`
          - Актуальная разработка продолжается в \`main\`.
          - Архивную ветку не следует сливать в \`main\`.
          EOF
            git add WellImporter RELEASE.md
            git commit -m "archive: Well Importer $version" -m "Preserve source snapshot for published release v$version." >/dev/null
            snapshot_sha=$(git rev-parse HEAD)
            git push --force origin "HEAD:refs/heads/archive/v$version"
            git tag -f "v$version" "$snapshot_sha"
            git push --force origin "refs/tags/v$version"

            notes="Исторический релиз Well Importer $version. Установочный ZIP предназначен для установки через QGIS: Плагины → Управление плагинами → Установить из ZIP. Исходный код версии сохранён в ветке archive/v$version."
            if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "v$version" "$zip_path" --clobber --repo "$GITHUB_REPOSITORY"
              gh release edit "v$version" --title "Well Importer $version" --notes "$notes" --repo "$GITHUB_REPOSITORY"
            else
              gh release create "v$version" "$zip_path" --title "Well Importer $version" --notes "$notes" --repo "$GITHUB_REPOSITORY"
            fi
          done

      - name: Publish current 2.1.0 release from main
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/wellimporter-release-work"
          PACKAGES="$WORK/packages"

          git fetch origin main
          git switch --detach origin/main
          grep -q '^version=2.1.0$' WellImporter/metadata.txt
          grep -q '^repository=https://github.com/SashaRai/WellImporter-QGIS$' WellImporter/metadata.txt

          stage="$WORK/stage-2.1.0"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp -a WellImporter "$stage/WellImporter"
          find "$stage/WellImporter" -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find "$stage/WellImporter" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete || true

          zip_path="$PACKAGES/WellImporter-v2.1.0.zip"
          rm -f "$zip_path"
          (cd "$stage" && zip -qr "$zip_path" WellImporter)
          unzip -tq "$zip_path"
          test "$(unzip -Z1 "$zip_path" | cut -d/ -f1 | sort -u)" = "WellImporter"
          unzip -Z1 "$zip_path" | grep -qx 'WellImporter/metadata.txt'
          unzip -Z1 "$zip_path" | grep -qx 'WellImporter/__init__.py'

          main_sha=$(git rev-parse origin/main)
          git tag -f v2.1.0 "$main_sha"
          git push --force origin refs/tags/v2.1.0

          cat > "$WORK/notes-2.1.0.md" <<'EOF'
          Актуальный стабильный релиз Well Importer 2.1.0.

          Основные изменения:
          - единый полный аудит проекта и мастер исправления ошибок;
          - интерактивный список проблем и режим «Следующая / Предыдущая ошибка»;
          - автоматическое создание отсутствующих кругов и контроль «1 точка = 1 круг»;
          - критическая проверка несовпадения номеров точки и круга;
          - автоматическое определение земельного участка и кадастрового номера;
          - статистика по годам, участкам, состояниям и партиям;
          - новый мастер подготовки выезда, фоновые карты, офлайн-пакет и обратная синхронизация;
          - автономная HTML-карта и режим «Полный рабочий цикл».

          Для установки в QGIS скачайте `WellImporter-v2.1.0.zip` и используйте «Плагины → Управление плагинами → Установить из ZIP».
          EOF

          if gh release view v2.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v2.1.0 "$zip_path" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit v2.1.0 --title "Well Importer 2.1.0" --notes-file "$WORK/notes-2.1.0.md" --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create v2.1.0 "$zip_path" --title "Well Importer 2.1.0" --notes-file "$WORK/notes-2.1.0.md" --latest --repo "$GITHUB_REPOSITORY"
          fi

      - name: Verify all Releases were published
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            v1.0.0 v1.1.0 v1.2.0 v1.3.0
            v1.4.0 v1.4.1 v1.4.2 v1.4.3 v1.4.4
            v1.5.0 v1.5.1 v1.5.2 v1.5.3 v1.5.4 v1.5.5 v1.5.6
            v1.6.0 v1.7.0 v1.8.0
            v2.0.0 v2.0.1 v2.0.2 v2.0.3 v2.0.4 v2.0.5 v2.0.6 v2.1.0
          )
          actual=$(gh api --paginate "/repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' | sort)
          for tag in "${expected[@]}"; do
            echo "$actual" | grep -qx "$tag"
            assets=$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets | length')
            test "$assets" -ge 1
          done
          count=$(printf '%s\n' "$actual" | grep -c '^v')
          echo "Published releases: $count"
          test "$count" -ge 27

      - name: Upload current QGIS installation ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: WellImporter-v2.1.0-QGIS
          path: ${{ runner.temp }}/wellimporter-release-work/packages/WellImporter-v2.1.0.zip
          if-no-files-found: error
          retention-days: 30
